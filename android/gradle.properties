# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# This setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# app's APK
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=false

# Allow Gradle to use non-transitive R classes
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Network retry config (helps with rate-limited maven mirrors)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.publish.checksums.insecure=true

# Use more retries for dependency download
systemProp.org.gradle.internal.http.retries=5
